[NovaDrop - Platform Leaderboard]
search = | makeresults count=3 \
| streamstats count as p \
| eval platform=case(p=1,"TikTok",p=2,"Instagram",p=3,"X / Twitter") \
| eval impressions=case(p=1,1200000,p=2,856000,p=3,344000) \
| eval orders=case(p=1,8100,p=2,6400,p=3,3700) \
| eval sentiment_pct=case(p=1,87,p=2,82,p=3,71) \
| eval conversion_rate=round(orders/impressions*100,2) \
| eval health_score=round((sentiment_pct*0.4)+(conversion_rate*500*0.4)+(orders/100*0.2),0) \
| eval rank=case(p=1,"🥇 #1",p=2,"🥈 #2",p=3,"🥉 #3") \
| sort health_score \
| table rank platform impressions orders sentiment_pct conversion_rate health_score \
| rename rank AS "Rank" platform AS "Platform" impressions AS "Impressions" orders AS "Orders" sentiment_pct AS "Sentiment %" conversion_rate AS "Conv. Rate %" health_score AS "Health Score"
cron_schedule = 0 * * * *
dispatch.earliest_time = -1h
dispatch.latest_time = now
enableSched = 1
description = Hourly platform leaderboard — ranks TikTok, Instagram, and X by composite health score (sentiment, conversion rate, order volume). Powers the ds.savedSearch on Dashboard 1.
